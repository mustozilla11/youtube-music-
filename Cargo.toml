[package]
name        = "ytmusic-rs"
version     = "0.4.0"
edition     = "2021"
description = "Lightweight YouTube Music desktop client for CachyOS / KDE"

[[bin]]
name = "ytmusic"
path = "src/main.rs"

[dependencies]
eframe      = "0.28"
egui        = "0.28"
tokio       = { version = "1", features = ["full"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
reqwest     = { version = "0.12", features = ["json"] }
image       = { version = "0.25", features = ["jpeg", "png", "webp"] }
directories = "5"
anyhow      = "1"

[profile.release]
opt-level      = 3
lto            = true
codegen-units  = 1
strip          = true
